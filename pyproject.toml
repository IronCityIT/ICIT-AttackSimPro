[project]
name = "attacksimpro-simcore"
version = "2.0.0"
description = "Iron City AttackSimPro — safe, authorized Purple-Team simulation engine"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
simcore = "simcore.cli:main"

[tool.setuptools]
packages = ["simcore", "simcore.scenarios"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
