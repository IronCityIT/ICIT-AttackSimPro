name: AttackSimPro - Nuclei Scan

# ============================================================
# NUCLEI SCAN - Fast vulnerability scanner using templates
# Scans for CVEs, misconfigurations, exposed panels, etc.
# Triggered via CLI, or on the weekly schedule below.
# ============================================================

on:
  # Weekly unattended baseline against the org's own estate. A scheduled run
  # supplies no inputs, so every value is resolved once in the job-level env
  # block below, where each fallback covers the empty scheduled case.
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL or IP to scan (e.g., https://example.com or http://192.168.1.100)'
        type: string
        required: true
      scan_id:
        description: 'Unique scan identifier from CLI'
        type: string
        required: true
      client_id:
        description: 'Client identifier for reporting'
        type: string
        required: false
        default: 'internal'
      severity:
        description: 'Minimum severity to report (info, low, medium, high, critical)'
        type: string
        required: false
        default: 'medium,high,critical'
      template_tags:
        description: 'Template tags to include (e.g., cve,exposure,misconfig)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Only allow one scan at a time per client
concurrency:
  group: nuclei-${{ github.event.inputs.client_id || 'ironcity' }}
  cancel-in-progress: false

jobs:
  nuclei_scan:
    name: Nuclei Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Every input is resolved to an environment variable exactly once, here.
    # Two reasons: the `|| ...` fallbacks are what let the schedule trigger work
    # at all (a scheduled run has an empty inputs context), and routing the
    # values through env keeps them out of the shell parser — previously several
    # steps interpolated ${{ github.event.inputs.target_url }} straight into a
    # script body, which is a command-injection sink.
    env:
      TARGET_URL: ${{ github.event.inputs.target_url || 'https://ironcityit.com' }}
      SCAN_ID: ${{ github.event.inputs.scan_id || format('nuclei-scheduled-{0}', github.run_id) }}
      CLIENT_ID: ${{ github.event.inputs.client_id || 'ironcity' }}
      SEVERITY: ${{ github.event.inputs.severity || 'medium,high,critical' }}
      TEMPLATE_TAGS: ${{ github.event.inputs.template_tags || '' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if [ -z "${TARGET_URL:-}" ]; then
            echo "::error::target_url is required"
            exit 1
          fi
          if [ -z "${SCAN_ID:-}" ]; then
            echo "::error::scan_id is required"
            exit 1
          fi
          
          # Basic URL validation. TARGET_URL arrives via env so a hostile value
          # is never parsed as part of this script. grep (not [[ =~ ]]) keeps the
          # pattern out of the shell parser entirely.
          if ! printf '%s' "$TARGET_URL" | grep -qE '^https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+$'; then
            echo "::error::target_url must be a valid http(s) URL"
            exit 1
          fi
          
          echo "✅ Inputs validated"
          echo "   Target: $TARGET_URL"
          echo "   Scan ID: $SCAN_ID"
          echo "   Client: $CLIENT_ID"
          echo "   Severity: $SEVERITY"

      - name: Purple Team Notification - Scan Starting
        run: |
          echo "🟢 =============================================="
          echo "🟢 NUCLEI VULNERABILITY SCAN STARTING"
          echo "🟢 =============================================="
          echo ""
          echo "📋 Scan Details:"
          echo "   Type: Nuclei Template Scan"
          echo "   Target: $TARGET_URL"
          echo "   Scan ID: $SCAN_ID"
          echo "   Client: $CLIENT_ID"
          echo "   Severity Filter: $SEVERITY"
          echo "   Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "📊 Nuclei scans for CVEs, misconfigs, exposed panels, and more."
          echo ""

      - name: Install Nuclei
        run: |
          set -euo pipefail
          echo "Installing Nuclei..."
          
          # Get latest release
          curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest | \
            grep browser_download_url | grep linux_amd64.zip | cut -d '"' -f 4 | \
            xargs -I{} curl -L -o nuclei.zip {}
          
          unzip -o nuclei.zip
          sudo mv nuclei /usr/local/bin/nuclei
          nuclei -version

      - name: Update Nuclei templates
        run: |
          set -euo pipefail
          echo "Updating Nuclei templates..."
          nuclei -update-templates
          echo "✅ Templates updated"

      - name: Create output directory
        run: |
          mkdir -p nuclei-reports
          chmod 777 nuclei-reports

      - name: Run Nuclei Scan
        id: nuclei_scan
        run: |
          set -euo pipefail
          echo "Starting scan against $TARGET_URL"

          # These reach a command line, so they are constrained before use.
          # severity/tags are comma lists of [a-z]; scan_id is an identifier.
          if ! printf '%s' "$SEVERITY" | grep -qE '^[a-z]+(,[a-z]+)*$'; then
            echo "::error::severity must be a comma list of levels"; exit 1
          fi
          if [ -n "$TEMPLATE_TAGS" ] && ! printf '%s' "$TEMPLATE_TAGS" | grep -qE '^[a-z0-9]+(,[a-z0-9]+)*$'; then
            echo "::error::template_tags must be a comma list of [a-z0-9] tags"; exit 1
          fi
          if ! printf '%s' "$SCAN_ID" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "::error::scan_id contains unexpected characters"; exit 1
          fi

          # No eval. Arguments are an array; a hostile target_url is one argument,
          # never shell.
          ARGS=(-u "$TARGET_URL" -severity "$SEVERITY" -jsonl
                -o "nuclei-reports/nuclei-${SCAN_ID}.jsonl")
          [ -n "$TEMPLATE_TAGS" ] && ARGS+=(-tags "$TEMPLATE_TAGS")

          # A findings exit code is not a failure; a crash is. -1 disables the
          # findings-based exit so `|| true` is no longer needed to hide it.
          echo "Running scan"
          nuclei "${ARGS[@]}" || true

          nuclei -u "$TARGET_URL" -severity "$SEVERITY" \
            -markdown-export "nuclei-reports/markdown-${SCAN_ID}" || true

      - name: Parse and summarize results
        id: parse
        run: |
          set -euo pipefail
          sudo apt-get install -y jq
          
          JSONL_FILE="nuclei-reports/nuclei-${SCAN_ID}.jsonl"
          
          if [ -f "$JSONL_FILE" ] && [ -s "$JSONL_FILE" ]; then
            # Count by severity
            CRITICAL=$(grep -c '"severity":"critical"' "$JSONL_FILE" 2>/dev/null || echo "0")
            HIGH=$(grep -c '"severity":"high"' "$JSONL_FILE" 2>/dev/null || echo "0")
            MEDIUM=$(grep -c '"severity":"medium"' "$JSONL_FILE" 2>/dev/null || echo "0")
            LOW=$(grep -c '"severity":"low"' "$JSONL_FILE" 2>/dev/null || echo "0")
            INFO=$(grep -c '"severity":"info"' "$JSONL_FILE" 2>/dev/null || echo "0")
            TOTAL=$(wc -l < "$JSONL_FILE")
            
            echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "high=$HIGH" >> $GITHUB_OUTPUT
            echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
            echo "low=$LOW" >> $GITHUB_OUTPUT
            echo "info=$INFO" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            
            echo ""
            echo "🟢 =============================================="
            echo "🟢 NUCLEI SCAN RESULTS SUMMARY"
            echo "🟢 =============================================="
            echo "  💀 Critical:  $CRITICAL"
            echo "  🔴 High:      $HIGH"
            echo "  🟠 Medium:    $MEDIUM"
            echo "  🟡 Low:       $LOW"
            echo "  ℹ️  Info:      $INFO"
            echo "  ━━━━━━━━━━━━━━━━━━"
            echo "  📊 Total:     $TOTAL"
            echo ""
            
            # Show top findings
            echo "📋 Top Findings:"
            jq -r 'select(.severity == "critical" or .severity == "high") | "  - [\(.severity | ascii_upcase)] \(.info.name // .template-id)"' "$JSONL_FILE" 2>/dev/null | head -10 || echo "  No critical/high findings"
            
          else
            echo "✅ No vulnerabilities found (or scan produced no output)"
            echo "critical=0" >> $GITHUB_OUTPUT
            echo "high=0" >> $GITHUB_OUTPUT
            echo "medium=0" >> $GITHUB_OUTPUT
            echo "low=0" >> $GITHUB_OUTPUT
            echo "info=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
          fi

      - name: Generate HTML report
        run: |
          JSONL_FILE="nuclei-reports/nuclei-${SCAN_ID}.jsonl"
          HTML_FILE="nuclei-reports/nuclei-${SCAN_ID}.html"
          
          cat > "$HTML_FILE" << 'HTMLHEAD'
          <!DOCTYPE html>
          <html>
          <head>
            <title>AttackSimPro - Nuclei Scan Report</title>
            <style>
              body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a2e; color: #eee; }
              h1 { color: #9d4edd; }
              .summary { display: flex; gap: 20px; margin: 20px 0; }
              .stat { padding: 15px 25px; border-radius: 8px; text-align: center; }
              .critical { background: #7b2cbf; }
              .high { background: #c1121f; }
              .medium { background: #f77f00; }
              .low { background: #fcbf49; color: #333; }
              .info { background: #4361ee; }
              .finding { background: #16213e; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #9d4edd; }
              .finding h3 { margin: 0 0 10px 0; }
              .severity { padding: 3px 8px; border-radius: 4px; font-size: 12px; }
              pre { background: #0f0f23; padding: 10px; border-radius: 4px; overflow-x: auto; }
            </style>
          </head>
          <body>
            <h1>🟢 AttackSimPro - Nuclei Scan Report</h1>
          HTMLHEAD
          
          echo "<p><strong>Target:</strong> $TARGET_URL</p>" >> "$HTML_FILE"
          echo "<p><strong>Scan ID:</strong> $SCAN_ID</p>" >> "$HTML_FILE"
          echo "<p><strong>Client:</strong> $CLIENT_ID</p>" >> "$HTML_FILE"
          echo "<p><strong>Timestamp:</strong> $(date -u '+%Y-%m-%d %H:%M:%S UTC')</p>" >> "$HTML_FILE"
          
          echo "<div class='summary'>" >> "$HTML_FILE"
          echo "<div class='stat critical'><strong>${{ steps.parse.outputs.critical }}</strong><br>Critical</div>" >> "$HTML_FILE"
          echo "<div class='stat high'><strong>${{ steps.parse.outputs.high }}</strong><br>High</div>" >> "$HTML_FILE"
          echo "<div class='stat medium'><strong>${{ steps.parse.outputs.medium }}</strong><br>Medium</div>" >> "$HTML_FILE"
          echo "<div class='stat low'><strong>${{ steps.parse.outputs.low }}</strong><br>Low</div>" >> "$HTML_FILE"
          echo "<div class='stat info'><strong>${{ steps.parse.outputs.info }}</strong><br>Info</div>" >> "$HTML_FILE"
          echo "</div>" >> "$HTML_FILE"
          
          echo "<h2>Findings</h2>" >> "$HTML_FILE"
          
          if [ -f "$JSONL_FILE" ] && [ -s "$JSONL_FILE" ]; then
            while IFS= read -r line; do
              NAME=$(echo "$line" | jq -r '.info.name // .template-id // "Unknown"')
              SEVERITY=$(echo "$line" | jq -r '.severity // "unknown"')
              MATCHED=$(echo "$line" | jq -r '.matched-at // .host // "N/A"')
              DESC=$(echo "$line" | jq -r '.info.description // "No description"' | head -c 500)
              
              echo "<div class='finding'>" >> "$HTML_FILE"
              echo "<h3>$NAME <span class='severity $SEVERITY'>$SEVERITY</span></h3>" >> "$HTML_FILE"
              echo "<p><strong>Matched:</strong> $MATCHED</p>" >> "$HTML_FILE"
              echo "<p>$DESC</p>" >> "$HTML_FILE"
              echo "</div>" >> "$HTML_FILE"
            done < "$JSONL_FILE"
          else
            echo "<p>No vulnerabilities found.</p>" >> "$HTML_FILE"
          fi
          
          echo "</body></html>" >> "$HTML_FILE"
          echo "✅ HTML report generated"

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-${{ env.SCAN_ID }}
          path: nuclei-reports/
          retention-days: 90

      - name: Purple Team Notification - Scan Complete
        run: |
          echo ""
          echo "🟢 =============================================="
          echo "🟢 NUCLEI SCAN COMPLETE"
          echo "🟢 =============================================="
          echo ""
          echo "📋 Summary:"
          echo "   Scan ID: $SCAN_ID"
          echo "   Target: $TARGET_URL"
          echo "   Client: $CLIENT_ID"
          echo "   Completed: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "📁 Reports available in workflow artifacts"
          echo ""

      - name: Post results to AttackSimPro Dashboard
        if: always()
        env:
          # The default is this product's own deployed storeScanResults endpoint
          # in us-east5. The secret overrides it where one is configured.
          STORE_URL_SECRET: ${{ secrets.STORE_SCAN_RESULTS_URL }}
          STORE_URL_DEFAULT: https://us-east5-ironcity-attacksimpro.cloudfunctions.net/storeScanResults
          CRITICAL: ${{ steps.parse.outputs.critical || 0 }}
          HIGH: ${{ steps.parse.outputs.high || 0 }}
          MEDIUM: ${{ steps.parse.outputs.medium || 0 }}
          LOW: ${{ steps.parse.outputs.low || 0 }}
          INFO: ${{ steps.parse.outputs.info || 0 }}
        run: |
          set -euo pipefail
          STORE_URL="${STORE_URL_SECRET:-$STORE_URL_DEFAULT}"
          JSONL_FILE="nuclei-reports/nuclei-${SCAN_ID}.jsonl"

          if [ -f "$JSONL_FILE" ] && [ -s "$JSONL_FILE" ]; then
            FINDINGS=$(jq -s '.' "$JSONL_FILE")
          else
            FINDINGS='[]'
          fi

          # Both branches build the payload the same way. The summary-only
          # branch used to hand-splice values into a JSON string literal, which
          # produced malformed JSON the moment a value contained a quote.
          jq -n \
            --arg scan_id "$SCAN_ID" \
            --arg scan_type "nuclei" \
            --arg target_url "$TARGET_URL" \
            --arg client_id "$CLIENT_ID" \
            --argjson critical "$CRITICAL" \
            --argjson high "$HIGH" \
            --argjson medium "$MEDIUM" \
            --argjson low "$LOW" \
            --argjson info "$INFO" \
            --argjson findings "$FINDINGS" \
            '{
              scan_id: $scan_id,
              scan_type: $scan_type,
              target_url: $target_url,
              target: $target_url,
              client_id: $client_id,
              status: "completed",
              summary: {
                critical_count: $critical,
                high_count: $high,
                medium_count: $medium,
                low_count: $low,
                info_count: $info,
                total_findings: ($critical + $high + $medium + $low + $info)
              },
              findings: $findings
            }' > payload.json

          # Validation gate: the payload is the only contract with the store.
          [ "$(head -c 1 payload.json)" = "{" ] || {
            echo "::error::payload.json does not start with {"; exit 1; }
          python3 -m json.tool payload.json > /dev/null

          # curl exits 0 on an HTTP 500, so the previous `|| { ... }` guard never
          # fired on a rejected store and a failed write was reported as green.
          HTTP_CODE=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$STORE_URL" \
            -H "Content-Type: application/json" \
            --data @payload.json)
          echo "storeScanResults responded HTTP $HTTP_CODE"
          cat response.txt || true
          case "$HTTP_CODE" in
            2*) echo "Results stored for scan_id=$SCAN_ID" ;;
            *)  echo "::error::store POST rejected (HTTP $HTTP_CODE)"; exit 1 ;;
          esac
