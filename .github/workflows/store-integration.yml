name: AttackSimPro - Store Integration (MariaDB)

# Verifies the self-hosted MariaDB store end to end against a REAL MariaDB service
# container (Firebase retired): applies deploy/mariadb/schema.sql, then runs the ingest
# handler through the MariaDB adapter via the env-gated integration test. No deploy, no
# NAS, no secrets — the service password is an ephemeral per-run value.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'functions/**'
      - 'deploy/mariadb/**'
      - '.github/workflows/store-integration.yml'

permissions:
  contents: read

jobs:
  mariadb-integration:
    name: Store round-trip against real MariaDB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: attacksimpro
          MARIADB_USER: asp
          # Ephemeral, per-run credentials for a throwaway CI container — not real secrets.
          MARIADB_PASSWORD: ci_${{ github.run_id }}
          MARIADB_ROOT_PASSWORD: root_${{ github.run_id }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      DB_PW: ci_${{ github.run_id }}
      ASP_MARIADB_URL: mysql://asp:ci_${{ github.run_id }}@127.0.0.1:3306/attacksimpro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for MariaDB and apply schema
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u asp -p"$DB_PW" --silent 2>/dev/null; then
              echo "MariaDB is up"; break
            fi
            echo "waiting for MariaDB ($i)"; sleep 3
          done
          mysql -h 127.0.0.1 -u asp -p"$DB_PW" attacksimpro < deploy/mariadb/schema.sql
          echo "schema applied"; mysql -h 127.0.0.1 -u asp -p"$DB_PW" attacksimpro -e "SHOW TABLES;"

      - name: Install the MariaDB driver (CI only — not committed as a dependency)
        working-directory: functions
        run: npm install --no-save --no-audit --no-fund mysql2@^3

      - name: Run the store test suite against real MariaDB
        working-directory: functions
        run: npm test

      - name: Verify backup + restore (DR) against real MariaDB
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_USER: root
          MARIADB_PASSWORD: root_${{ github.run_id }}
          MARIADB_DATABASE: attacksimpro
          ASP_BACKUP_DIR: ${{ runner.temp }}/asp-backups
        run: |
          set -euo pipefail
          Q() { mysql -h 127.0.0.1 -u root -p"root_${{ github.run_id }}" "$@"; }
          # Seed a known row, back it up, delete it, restore, and prove it came back.
          Q attacksimpro -e "INSERT INTO clients (client_id, client_name) VALUES ('dr-test','DR Test');"
          sh deploy/mariadb/backup.sh
          DUMP=$(ls -1t "$ASP_BACKUP_DIR"/asp-attacksimpro-*.sql.gz | head -1)
          test -s "$DUMP" && echo "dump: $DUMP"
          Q attacksimpro -e "DELETE FROM clients WHERE client_id='dr-test';"
          sh deploy/mariadb/restore.sh "$DUMP"
          N=$(Q -N -e "SELECT COUNT(*) FROM attacksimpro.clients WHERE client_id='dr-test';")
          echo "restored rows for dr-test: $N"
          test "$N" = "1"
          echo "DR verify OK: backup + restore round-tripped the row"

  container-build:
    name: Build + smoke the production container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (server.js + mysql2, no firebase)
        run: docker build -f functions/Dockerfile.prod -t asp-ingest:ci functions
      - name: Run the container (in-memory store) and smoke it
        run: |
          set -euo pipefail
          docker run -d --name asp -p 8088:8088 -e INGEST_TOKEN=citok -e ASP_STORE=memory asp-ingest:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/healthz || true)
            [ "$code" = "200" ] && { echo "healthz ok after ${i}"; break; }
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/healthz)" = "200"
          # token gate: unauthenticated POST is rejected
          test "$(curl -s -o /dev/null -w '%{http_code}' -XPOST http://127.0.0.1:8088/ -d '{}')" = "401"
          # authenticated ingest stores
          code=$(curl -s -o /tmp/r -w '%{http_code}' -XPOST http://127.0.0.1:8088/ \
            -H 'Content-Type: application/json' -H 'X-Ingest-Token: citok' \
            --data '{"client_name":"CI Client","scan_id":"c1","status":"completed","findings":[]}')
          echo "ingest response: $code $(cat /tmp/r)"
          test "$code" = "200"
          grep -q '"status":"stored"' /tmp/r
          echo "container smoke OK"
          docker logs asp 2>&1 | tail -10
          docker rm -f asp >/dev/null
